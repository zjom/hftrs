[package]
name = "moldudp"
description="MoldUDP64 client"
license = "Unlicense"
version = "0.1.1"
edition = "2024"

[dependencies]
bon = "3.9.1"
crossbeam = "0.8.4"
tracing = "0.1.44"
zerocopy = {version="0.8.48", features=["derive"]}

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports", "cargo_bench_support"] }

[[bench]]
name = "client_bench"
harness = false

