[package]
name = "moldudp"
description="MoldUDP64 client"
author = "zjom"
license = "Unlicense"
version = "0.1.1"
edition = "2024"

[dependencies]
bon = "3.9.1"
crossbeam = "0.8.4"
memmap2 = "0.9.10"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand = "0.10.1"
anyhow = "1.0.102"
env_logger = "0.11.10"
log = "0.4.29"
ctrlc = "3.5.2"
itch5 = "0.1.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "client_bench"
harness = false

